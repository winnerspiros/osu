name: Build Android APK

on:
  push:
    tags:
      - '*.*.*'
      - '!*-*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 17

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Ensure Android NDK and CMake are available
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null 2>&1

      - name: Build native library (libosu_native.so)
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          CMAKE_BIN="$ANDROID_HOME/cmake/3.22.1/bin/cmake"

          # Only build arm64-v8a to minimize APK size
          for ABI in arm64-v8a; do
            echo "::group::Building osu_native for $ABI"
            "$CMAKE_BIN" -B "build-native/$ABI" -S osu.Android/Native \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-33 \
              -DCMAKE_BUILD_TYPE=Release
            "$CMAKE_BIN" --build "build-native/$ABI" --config Release -j "$(nproc)"
            mkdir -p "osu.Android/libs/$ABI"
            cp "build-native/$ABI/libosu_native.so" "osu.Android/libs/$ABI/"
            echo "::endgroup::"
          done

          echo "Native libraries built successfully:"
          find osu.Android/libs -name "*.so" -exec ls -lh {} \;

      - name: Decode keystore
        id: keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/osu.Android/osu.keystore"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Set version
        id: version
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        run: |
          # Use optimized publish command with aggressive trimming and RID-specific build
          PUBLISH_CMD="dotnet publish -c Release osu.Android/osu.Android.csproj -f net10.0-android -r android-arm64 --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidCreatePackagePerAbi=false"

          if [ "${{ steps.keystore.outputs.has_keystore }}" == "true" ]; then
            $PUBLISH_CMD \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore=${{ github.workspace }}/osu.Android/osu.keystore \
              -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }} \
              -p:AndroidSigningKeyPass=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }} \
              -p:AndroidSigningStorePass=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          else
            $PUBLISH_CMD -p:AndroidKeyStore=false
          fi

      - name: Find and Optimize APK
        id: find_apk
        run: |
          # The publish output for android-arm64 RID is in a specific folder
          PUBLISH_DIR="osu.Android/bin/Release/net10.0-android/android-arm64/publish"
          APK=$(find "$PUBLISH_DIR" -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find osu.Android/bin/Release -name "*.apk" | head -1)
          fi

          echo "Optimizing APK using zipalign if available..."
          # zipalign is usually in the build-tools directory of Android SDK
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -r | head -1)
          if [ -n "$ZIPALIGN" ]; then
            $ZIPALIGN -v 4 "$APK" "${APK}.aligned"
            mv "${APK}.aligned" "$APK"
            echo "zipalign complete."
          fi

          echo "Final APK size: $(du -h $APK | cut -f1)"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: osu-android-${{ github.ref_name }}-arm64-optimized
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
